<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero options · John Bell</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="../assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .lab { padding: clamp(90px, 10vw, 130px) 0 80px; }
    .lab h1 { font-size: clamp(40px, 6vw, 80px); letter-spacing: -0.05em; }
    .lab__intro { color: var(--grey-7); max-width: 60ch; margin-top: 14px; font-size: 17px; }
    .lab__tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .lab__tools button { border: 1px solid var(--line); background: var(--white); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .lab__tools button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
    .opts { display: grid; gap: 56px; margin-top: 48px; }
    .opt { display: grid; gap: 14px; }
    .opt__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .opt__head h2 { font-size: clamp(24px, 2.6vw, 34px); letter-spacing: -0.03em; }
    .opt__head h2 b { display: inline-grid; place-items: center; width: 44px; height: 44px; margin-right: 12px; border-radius: 50%; background: var(--hl-yellow); color: #18181a; font-size: 16px; vertical-align: middle; }
    .opt__idea { color: var(--grey-7); font-size: 15px; max-width: 70ch; }
    .opt__open { font-weight: 600; text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
    .opt__open:hover { background: var(--grey-1); }
    .opt__frame { position: relative; width: 100%; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--grey-1); }
    .opt__frame iframe { display: block; border: 0; background: #fff; transform-origin: 0 0; }
    .opts.is-phone .opt__frame { max-width: 390px; }
    .opt__missing { padding: 60px 20px; text-align: center; color: var(--grey-5); }
  </style>
</head>
<body>
  <main class="lab wrap">
    <span class="label">Home page hero</span>
    <h1>Ten <mark class="hl is-lit">hero options.</mark></h1>
    <p class="lab__intro">Each one is live, so scroll, hover and click inside it. Pick a favourite (or two to combine) and I’ll build it into the home page. Open any one full screen for the real feel.</p>
    <div class="lab__tools" role="group" aria-label="Preview size">
      <button type="button" data-size="desktop" aria-pressed="true">Desktop</button>
      <button type="button" data-size="phone" aria-pressed="false">Phone</button>
    </div>
    <div class="opts" data-opts></div>
  </main>
  <script>
    const OPTS = [
      ['01', 'Showroom', 'Your best four projects take over the hero in turn, each in its own brand colour, with a laptop and phone over a highlighter scribble.'],
      ['02', 'Big type, real work', 'A giant headline with your real product cards, polaroids and stickers tucked into and around the letters.'],
      ['03', 'Wall of work', 'Headline on the left; three columns of real mockups drifting past on the right, each one clickable.'],
      ['04', 'Hi, I’m John', 'A personal freelancer intro with a portrait slot, availability, and small proof chips around you.'],
      ['05', 'Pick your business', 'Choose window cleaner, café, salon and more, and a phone shows a concept site made for that business.'],
      ['06', 'Desk flat-lay', 'A styled top-down desk of your real work: laptop, phone, brochure, business cards and a highlighter.'],
      ['07', 'Phone fan', 'Five phones fanned like a hand of cards, each playing a project; lift one out to see it.'],
      ['08', 'Highlighter headline', '“I design websites people like to use / buy from / book with / come back to”, with a matching phone.'],
      ['09', 'Before / after', 'Drag between a tired small-business site and the same business redesigned by you.'],
      ['10', 'Scrapbook', 'Your work as a tidy scrapbook spread, pieces placed one by one and draggable.'],
    ];
    const wrap = document.querySelector('[data-opts]');
    let size = 'desktop';
    const render = () => {
      wrap.classList.toggle('is-phone', size === 'phone');
      wrap.innerHTML = OPTS.map(([n, name, idea]) => `
        <section class="opt" id="hero-${n}">
          <div class="opt__head"><h2><b>${n}</b>${name}</h2><a class="opt__open" href="hero-${n}.html" target="_blank" rel="noopener">Open full screen ↗</a></div>
          <p class="opt__idea">${idea}</p>
          <div class="opt__frame" data-n="${n}"></div>
        </section>`).join('');
      wrap.querySelectorAll('.opt__frame').forEach(frame => {
        const n = frame.dataset.n;
        const w = size === 'phone' ? 390 : 1440, h = size === 'phone' ? 844 : 900;
        const load = () => {
          const ifr = document.createElement('iframe');
          ifr.src = `hero-${n}.html`; ifr.title = `Hero option ${n}`; ifr.loading = 'lazy';
          ifr.width = w; ifr.height = h;
          const fit = () => { const s = frame.clientWidth / w; ifr.style.transform = `scale(${s})`; frame.style.height = `${h * s}px`; };
          frame.append(ifr); fit(); addEventListener('resize', fit);
          ifr.addEventListener('error', () => { frame.innerHTML = '<p class="opt__missing">Still being built…</p>'; });
        };
        fetch(`hero-${n}.html`, { method: 'HEAD' }).then(r => r.ok ? load() : (frame.innerHTML = '<p class="opt__missing">Still being built…</p>')).catch(load);
      });
    };
    document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      size = b.dataset.size;
      document.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    }));
    render();
  </script>
</body>
</html>
